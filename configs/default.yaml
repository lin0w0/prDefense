# 已训练模型的登记表；相对路径以项目根目录为准。
models:
  resnet18:
    arch: resnet18          # 重建网络时使用，需与权重一致
    weights: models/train_weights/ResNet-18/best_model.pth
    description: ResNet-18，同济掌纹 session1 训练、session2 验证
  vgg16:
    arch: vgg16
    weights: models/train_weights/VGG-16/best_model.pth
    description: VGG-16，同济掌纹 session1 训练、session2 验证

evaluation:
  dataset: tongji
  data_root: data/resources   # 目录下需有 Tongji/ROI/session1 与 session2
  session: 2                  # 与训练时的验证批次一致
  batch_size: 32
  num_workers: 0
  output_dir: outputs/evaluate

attacks:
  # 攻击生成的对抗样本保存根目录；相对路径以项目根目录为准。
  output_dir: outputs/adv
  seed: 42
  # L∞ 扰动上限，单位 1/255；命令行 --epsilon 可覆盖。也可以每次生成对抗样本之前，调整这个数值。
  epsilon: 1
  pgd:
    steps: 10
    alpha_scale: 2.5        # alpha = epsilon / steps * alpha_scale
    random_start: true
  bim:                      # BIM / I-FGSM
    steps: 10
    alpha_scale: 1.0        # alpha = epsilon / steps
  cw:                       # L2 优化，不使用 epsilon
    steps: 50
    c: 1.0
    kappa: 0.0
    lr: 0.01
  apgd:
    steps: 30
    rho: 0.75               # 振荡判据，越小越容易触发步长减半

